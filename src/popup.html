<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Auto Twish</title>
<link rel="stylesheet" href="ui.css" />
<style>
  body {
    width: 290px;
    padding: 12px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .channel-label {
    font-size: 12px;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    line-height: 1.4;
  }
  .channel-label.muted {
    color: var(--text-muted);
  }
  .channel-label strong {
    color: var(--accent-text);
  }
  .enable-row {
    margin-top: 12px;
    font-size: 13px;
  }
  .clock {
    margin-top: 14px;
    padding: 10px 8px;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 4px;
    text-align: center;
  }
  #countdown {
    font-size: 15px;
  }
  #countdown.muted,
  #countdown.waiting {
    font-size: 12px;
  }
  #checking {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text-faint);
    margin-top: 3px;
  }
  #checking:empty {
    display: none;
  }
  #status {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 6px;
    text-align: center;
    min-height: 1em;
  }
  .game {
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: grid;
    gap: 6px;
    font-size: 12px;
  }
  .game-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    line-height: 1.35;
  }
  .game-line .label {
    color: var(--text-muted);
  }
  .game-line strong {
    color: var(--text);
  }
  .game-line.warn strong {
    color: var(--warn);
  }
  .btn.small {
    padding: 3px 8px;
    font-size: 11px;
    flex: none;
  }
  #openOptions {
    width: 100%;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <header>
    <h1>Auto Twish <span id="version" class="version"></span></h1>
    <button id="gear" class="icon-btn" title="Configurações" aria-label="Configurações">⚙</button>
  </header>

  <div id="channelLabel" class="channel-label muted">Carregando canal…</div>
  <div id="safetyLine" class="channel-label" style="margin-top:8px;border-color:var(--warn);color:var(--warn)" hidden>
    🤖 <strong style="color:var(--warn)">Verificação pendente no Twish.</strong> Envios pausados —
    <a href="https://twish.com.br/verificacao" target="_blank" rel="noopener" style="color:var(--warn)">resolver</a>.
    Retoma sozinho.
  </div>
  <div id="expeditionLine" class="channel-label" style="margin-top:8px" hidden></div>

  <label class="row-between enable-row">
    <span>Ativado neste canal</span>
    <input type="checkbox" id="enabled" class="switch" />
  </label>

  <div class="field-label">Modo</div>
  <div id="mode" class="segmented" role="radiogroup" aria-label="Modo">
    <button type="button" role="radio" data-mode="manual">Manual</button>
    <button type="button" role="radio" data-mode="auto">Automático</button>
    <button type="button" role="radio" data-mode="semi">Semi</button>
  </div>
  <div id="modeHint" class="hint"></div>

  <div id="rodField" hidden>
    <label class="field-label" for="rod">Vara</label>
    <select id="rod"></select>
  </div>

  <div class="clock">
    <div id="countdown" class="countdown muted">—</div>
    <div id="checking"></div>
  </div>
  <div id="twishStatus" class="hint"></div>

  <div id="game" class="game" hidden>
    <div id="eventLine" class="game-line" hidden></div>
    <div class="game-line">
      <span><span class="label">Peixe em destaque:</span> <strong id="featuredFish">—</strong> <span id="featuredAge" class="label"></span></span>
      <button id="askFeatured" class="btn secondary small" title="Envia $destaque no chat">Consultar</button>
    </div>
    <div id="duelLine" class="game-line warn" hidden></div>
  </div>

  <button id="openOptions" class="btn secondary">Configurações</button>
  <div id="status"></div>

  <script src="browser-polyfill.js"></script>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
